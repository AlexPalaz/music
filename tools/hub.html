<!doctype html>
<html lang="it" data-pixel-id="{{PIXEL_ID}}" data-release="HUB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ARTIST_TITLE}}</title>
  <meta name="description" content="{{ARTIST_TITLE}} · {{ARTIST_TAG}}. Tutte le uscite.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="{{LATEST_SLUG}}/icon.png">
  <link rel="apple-touch-icon" href="{{LATEST_SLUG}}/icon.png">
  <link rel="canonical" href="{{BASE_URL}}/">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ARTIST_TITLE}}">
  <meta property="og:description" content="{{ARTIST_TAG}}">
  <meta property="og:image" content="{{BASE_URL}}/{{LATEST_SLUG}}/og.jpg">
  <meta property="og:url" content="{{BASE_URL}}/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/style.css">
  <script src="shared/pixel.js"></script>
</head>
<body>
  <div class="glow"></div>
  <main>
    <div class="hub-head">
      <h1>{{ARTIST}}</h1>
      <div class="hub-tag">{{ARTIST_TAG}}</div>
    </div>

    <nav class="grid" aria-label="Uscite">
{{CARDS}}
    </nav>
  </main>

  <footer>© {{YEAR}} {{ARTIST}} · <a href="https://instagram.com/{{INSTAGRAM}}">@{{INSTAGRAM}}</a></footer>
</body>
</html>
